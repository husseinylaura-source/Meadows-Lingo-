<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meadows Lingo · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Readex+Pro:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/portal.css">
</head>
<body>
<header class="top"><div class="wrap"><div class="brand"><img class="logo-img" src="img/logo-mark.png" alt="" width="40" height="40"><span class="name">Meadows Lingo</span><span class="ar brand-ar">تعلّم العربية</span></div></div></header>
<main class="wrap" style="padding-top:28px">
  <div id="demo" class="demo-banner" hidden></div>
  <div id="view"><div class="card muted">Loading…</div></div>
</main>
<div class="toast" id="toast" hidden></div>
<script src="js/config.js"></script>
<script type="module">
import * as B from "./js/backend.js";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3200); }
let staffMode = "signin", busy = false, lastErr = "";

if (B.DEMO) {
  const d = $("#demo"); d.hidden = false;
  d.innerHTML = `<b>Demo mode.</b> Firebase isn't connected yet, so everything is saved only in this browser. Try it out:
   <div class="demo-grid"><span>Admin</span><code>${esc(B.OWNER)}</code><span>password <code>demo123</code></span>
   <span>Teacher</span><code>demo.teacher@school.ae</code><span>password <code>demo123</code></span>
   <span>Student</span><code>SARA77</code><span>(or OMAR77, MAYA99)</span></div>
   <button class="btn sm ghost" id="resetDemo">Reset demo data</button>`;
  $("#resetDemo").onclick = () => { B.resetDemo(); location.reload(); };
}

function page() {
  $("#view").innerHTML = `<div class="portal-logo"><img src="img/logo.png" alt="Meadows Lingo · Arabic B" width="320"></div>
  <div class="hero-ar ar" style="text-align:center">أهلا وسهلا</div>
  <h1 class="portal-title">Welcome to Meadows Lingo</h1>
  <div class="portal">
   <section class="card stack portal-card">
    <div><div class="eyebrow">Students</div><h2>Enter your code</h2><p class="small muted">Your teacher gave you a code with 6 letters and numbers.</p></div>
    <form id="sf" class="stack">
     <input id="code" class="code-input" type="text" maxlength="7" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="K7M2QP" aria-label="Your code">
     <button class="btn big go" id="sgo">Start learning</button>
    </form>
    <div id="serr" class="err" role="alert">${esc(lastErr)}</div>
   </section>
   <section class="card stack portal-card">
    <div><div class="eyebrow">Teachers and admin</div><h2>${staffMode === "create" ? "Set your password" : staffMode === "forgot" ? "Reset your password" : "Staff sign in"}</h2>
     <p class="small muted">${staffMode === "create" ? "First time here? Use the school email the admin added, and choose a password. We'll send you an email to confirm it's you." : staffMode === "forgot" ? "We'll email you a link to choose a new password." : "Use your school email."}</p></div>
    <form id="tf" class="stack">
     <label class="field">Email<input type="email" id="em" autocomplete="username" required placeholder="name@school.ae"></label>
     ${staffMode !== "forgot" ? `<label class="field">${staffMode === "create" ? "Choose a password (at least 8 characters)" : "Password"}<input type="password" id="pw" autocomplete="${staffMode === "create" ? "new-password" : "current-password"}" required minlength="${staffMode === "create" ? 8 : 6}"></label>` : ""}
     <button class="btn primary">${staffMode === "create" ? "Create password" : staffMode === "forgot" ? "Send reset link" : "Sign in"}</button>
    </form>
    <div id="terr" class="err" role="alert"></div>
    <div class="row small">
     ${staffMode !== "signin" ? `<button class="btn sm ghost" data-mode="signin">Back to sign in</button>` : `<button class="btn sm ghost" data-mode="create">First time here?</button><button class="btn sm ghost" data-mode="forgot">Forgot password</button>`}
    </div>
   </section>
  </div>`;
  const ci = $("#code");
  ci.oninput = () => { ci.value = ci.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6); };
  $("#sf").onsubmit = async e => {
    e.preventDefault(); if (busy) return; busy = true; lastErr = ""; $("#serr").textContent = ""; $("#sgo").disabled = true; $("#sgo").textContent = "Checking…";
    try { await B.studentLogin(ci.value); }
    catch (err) { $("#serr").textContent = B.friendlyError(err); $("#sgo").disabled = false; $("#sgo").textContent = "Start learning"; }
    busy = false;
  };
  $("#tf").onsubmit = async e => {
    e.preventDefault(); if (busy) return; busy = true; $("#terr").textContent = "";
    const em = $("#em").value, pw = $("#pw") ? $("#pw").value : "";
    try {
      if (staffMode === "create") await B.staffCreatePassword(em, pw);
      else if (staffMode === "forgot") { await B.resetPassword(em); toast("If that email has an account, a reset link is on its way."); staffMode = "signin"; page(); }
      else await B.staffLogin(em, pw);
    } catch (err) { if ($("#terr")) $("#terr").textContent = B.friendlyError(err); }
    busy = false;
  };
  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { staffMode = b.dataset.mode; page(); });
  setTimeout(() => ci.focus(), 50);
}

function unverified(email) {
  $("#view").innerHTML = `<div class="card stack" style="max-width:560px;margin:0 auto">
   <h2>Check your email</h2>
   <p>We sent a link to <b>${esc(email)}</b>. Open it to confirm this is your email, then come back and press the button below.</p>
   <p class="small muted">Can't see it? Look in Junk or Other. It comes from noreply@ your Firebase project.</p>
   <div class="row"><button class="btn primary" id="chk">I've confirmed my email</button><button class="btn" id="again">Send it again</button><button class="btn ghost" id="out">Sign out</button></div>
   <div id="verr" class="err"></div></div>`;
  $("#chk").onclick = async () => { const u = await B.recheckVerify(); if (u && u.verified) route(u); else $("#verr").textContent = "Not confirmed yet. Open the link in the email first."; };
  $("#again").onclick = async () => { try { await B.resendVerify(); toast("Sent again"); } catch (e) { $("#verr").textContent = B.friendlyError(e); } };
  $("#out").onclick = () => B.signOut();
}
function notStaff(email) {
  $("#view").innerHTML = `<div class="card stack" style="max-width:560px;margin:0 auto">
   <h2>Not on the staff list yet</h2><p><b>${esc(email)}</b> can sign in, but the admin hasn't added it as a teacher. Ask the admin to add this email, then sign in again.</p>
   <button class="btn" id="out" style="align-self:flex-start">Sign out</button></div>`;
  $("#out").onclick = () => B.signOut();
}

async function route(u) {
  if (!u) { page(); return; }
  try {
    const s = await B.resolveSession(u);
    if (!s) page();
    else if (s.kind === "student") location.replace("app.html");
    else if (s.kind === "staff") location.replace("staff.html");
    else if (s.kind === "unverified") unverified(s.email);
    else notStaff(s.email);
  } catch (e) { lastErr = B.friendlyError(e); page(); }
}
B.onAuth(route).catch(e => { $("#view").innerHTML = `<div class="card err">Couldn't connect: ${esc(B.friendlyError(e))}</div>`; });
</script>
</body>
</html>
